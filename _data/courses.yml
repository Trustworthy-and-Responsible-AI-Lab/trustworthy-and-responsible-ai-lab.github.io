    - display: "Winter 2022"
      url: "/courses/MLSec/W22/index.html"

- id: cybersec
  title: "Cyber-Security"
  number: "CS578"
  level: Graduate
  image: "/assets/images/courses/course-cybersec.jpg"
  description: >
    Covers foundational and advanced topics in computer security:
    cryptography, network security, web security, OS security,
    memory safety, side channels, malware, and trustworthy ML.
    Includes paper reading and a semester-long research project.
  offerings:
    - display: "Fall 2026"
      url: "/courses/Sec-Grad/current/index.html"
      current: true
    - display: "Spring 2025"
      url: "/courses/Sec-Grad/Sp25/index.html"

- id: introsec
  title: "Introduction to Security"
  number: "CS370"
  level: Undergraduate
  image: "/assets/images/courses/course-introsec.jpg"
  description: >
    An introductory course on computer security for undergraduates.
    Topics include cryptography, network security, web security,
    software security, and trustworthy ML. Includes hands-on labs.
  offerings:
    - display: "Spring 2023"
      url: "/courses/Sec-UGrad/current/index.html"
      current: true

- id: os1
  title: "Operating Systems I"
  number: "CS374 / CS344"
  level: Undergraduate
  image: "/assets/images/courses/course-os.jpg"
  description: >
    Covers the fundamentals of operating systems: processes, threads,
    scheduling, virtual memory, file systems, I/O, signals, sockets,
    and synchronization. Assignments are in C and Rust.
  offerings:
    - display: "Spring 2026"
      url: "/courses/OS1/current/index.html"
      current: true
    - display: "Winter 2023"
      url: "/courses/OS1/W23/index.html"
