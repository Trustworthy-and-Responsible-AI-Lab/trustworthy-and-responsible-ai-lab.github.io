- id: mlsec
  title: "Trustworthy ML"
  number: "AI539 / CS499-599"
  level: Graduate
  image: "/assets/images/courses/course-mlsec.jpg"
  description: >
    Covers the security and privacy of machine learning systems.
    Topics include adversarial examples, data poisoning, backdoor attacks,
    membership inference, and defenses. Students read and present recent papers
    and complete a research project.
  offerings:
