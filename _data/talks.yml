# Talks & Presentations
# Each entry renders as a card with YouTube thumbnail, title, and link buttons.
#
# Fields:
#   title:        talk/presentation title
#   youtube_id:     YouTube video ID (e.g. "dQw4w9WgXcQ") — auto-generates thumbnail
#   slideslive_id:  SlidesLive presentation ID (e.g. "39047893")
#   thumbnail:      thumbnail image URL or path — required for SlidesLive entries
#                   (SlidesLive thumbnail: https://ma.slideslive.com/library/presentations/{ID}/poster/{filename}.png)
#   speaker:        presenter name(s), e.g. "Sanghyun Hong"
#   event:          venue or conference name (optional)
#   date:           display string, e.g. "May 2025" or "2 months ago"
#   links:
#     youtube:        full YouTube URL
#     slideslive:     SlidesLive URL (auto-built from slideslive_id if empty)
#     paper:          paper PDF / arXiv URL
#     slides:         slides URL
#     project:        project page URL
#     project_name:   button label for project link (default: "Project")
#

