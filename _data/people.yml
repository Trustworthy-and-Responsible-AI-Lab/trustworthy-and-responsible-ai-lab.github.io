professor:
  name: Sanghyun Hong
  title: Assistant Professor
  dept: School of EECS / Computer Science
  university: Oregon State University
  photo: /assets/images/people/sanghyun-hong.jpg
  email: sanghyun.hong@oregonstate.edu
  office: "Room 2029, Kelley Engineering Center (KEC)"
  scholar: "https://scholar.google.com/citations?hl=en&user=664LW90AAAAJ&view_op=list_works&sortby=pubdate"
  github: "https://github.com/Sanghyun-Hong"
  twitter: "https://twitter.com/sanghyun_hong"
  personal: "https://sanghyun-hong.github.io"
  cv: "https://sanghyun-hong.github.io/docs/Hong_CV.pdf"
  bio: >
    Sanghyun Hong is an Assistant Professor of Computer Science at Oregon State University.
    His research spans trustworthy and responsible AI, focusing on the security and privacy
    of machine learning systems — including adversarial robustness, data poisoning,
    hardware fault attacks, and privacy of foundation models.
    Before joining OSU, he was a PhD student at the University of Maryland.

