# Research areas — must stay in sync with the lab pillars on index.html.
# papers: exact titles from publications.yml (papers or preprints).

- id: ai-security-privacy
  title: "AI Security/Privacy"
  icon: "shield-check"
  description: >
    We study how the models themselves can be attacked and protected. Our work spans
    data poisoning and backdoors, adversarial robustness, memorization and membership
    inference, extraction of personally identifiable information from language models,
    and provenance mechanisms such as watermarking.
  papers:
    - "Private Investigator: Extracting Personally Identifiable Information from Large Language Models Using Optimized Prompts"
    - "IF-Guide: Influence Function-Guided Detoxification of LLMs"
    - "SoK: Watermarking for AI-Generated Content"
    - "Privacy Backdoors: Enhancing Membership Inference through Poisoning Pre-trained Models"
    - "Handcrafted Backdoors in Deep Neural Networks"

- id: ai-reliability
  title: "AI Reliability"
  icon: "cpu"
  description: >
    We examine where AI systems degrade once they leave the lab: hardware faults and
    parameter corruptions, the robustness cost of compression techniques such as
    quantization and early exits, and the end-to-end resilience of large-scale
    inference pipelines.
  papers:
    - "Hessian-aware Training for Enhancing DNNs Resilience to Parameter Corruptions"
    - "Demystifying the Resilience of Large Language Model Inference: An End-to-End Perspective"
    - "Harnessing Input-adaptive Inference for Efficient VLN"
    - "Qu-ANTI-zation: Exploiting Neural Network Quantization for Achieving Adversarial Outcomes"
    - "Terminal Brain Damage: Exposing the Graceless Degradation in Deep Neural Networks Under Hardware Fault Attacks"

- id: agentic-ai
  title: "Agentic AI Systems"
  icon: "robot"
  description: >
    As LLM-driven agents gain the ability to browse, execute, and act on a user's behalf,
    they inherit both model-level and systems-level attack surfaces. We study indirect
    prompt injection in web agents, time-of-check to time-of-use vulnerabilities, and how
    long-standing browser isolation guarantees break down in agentic settings.
  papers:
    - "Site Isolation is Dead: How Site Isolation is Broken in Agentic Browsers and Extensions"
    - "AgentBreaker: A Framework for Evaluating Context-Aware Indirect Prompt Injection Risks in Modern Web Agents"
    - "Mind the Gap: Time-of-Check to Time-of-Use Vulnerabilities in LLM-Enabled Agents"

- id: ai-for-cybersecurity
  title: "AI for Cybersecurity"
  icon: "lock"
  description: >
    We turn AI systems back toward defense, using them to find and triage real security
    problems at scale, while measuring how far the resulting detectors can be trusted.
    Our work covers Internet-scale exposure discovery, malware and phishing detection
    under evasion and concept drift, and audio deepfake detection.
  papers:
    - "Exposure is All You Need: Using LLMs to Identify Critical Endpoints at Internet Scale"
    - "When Does Wasm Malware Detection Fail? A Systematic Analysis of Their Robustness to Evasion"
    - "Evaluating Robustness of Reference-based Phishing Detectors"
    - "MADCAT: Combating Malware Detection Under Concept Drift with Test-Time Adaptation"
    - "Enhancing Audio Deepfake Detection by Improving Representation Similarity of Bonafide Speech"
